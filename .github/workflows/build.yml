# NEXORA – ndërton automatikisht setup-in për Windows dhe APK për Android.
# Nis: GitHub → Actions → "Ndërto NEXORA" → Run workflow
# (ose automatikisht kur bën push një tag si v1.0.1)
# Çdo build publikohet si "latest" te Releases → nexoraweb.ch/app.html shkarkon gjithmonë versionin e ri.
name: Ndërto NEXORA

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Player-Windows
          path: dist/*.exe

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - name: Ikonat e aplikacionit
        run: npm run android:icons
        continue-on-error: true
      - run: npx cap sync android
      - name: Banner për Android TV
        run: |
          mkdir -p android/app/src/main/res/drawable-xhdpi
          cp assets/tv-banner.png android/app/src/main/res/drawable-xhdpi/tv_banner.png
      - name: Mbështetje për Android TV (telekomandë + ikonë në TV)
        run: |
          python3 - <<'EOF'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'LEANBACK_LAUNCHER' not in s:
              s = re.sub(r'(<category android:name="android\.intent\.category\.LAUNCHER"\s*/>)',
                         r'\1\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />', s, count=1)
              s = s.replace('<application', '<uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <application android:banner="@drawable/tv_banner"', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print(s)
          EOF
      - name: Ndërto APK
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then
            # Nënshkrim i përhershëm → përditësimet instalohen mbi versionin e vjetër
            KS_PASS="$(printf '%s' "$KS_PASS" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            KS_ALIAS="$(printf '%s' "$KS_ALIAS" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            KS_ALIAS="${KS_ALIAS:-nexora}"
            printf '%s' "$KS_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks" \
              || { echo "::error::ANDROID_KEYSTORE_B64 nuk është i saktë – kopjo prapë gjithë tekstin nga ANDROID_KEYSTORE_B64.txt"; exit 1; }
            echo "Keystore: $(stat -c %s "$RUNNER_TEMP/release.jks") bytes (duhet 4328) · fjalëkalimi: ${#KS_PASS} shenja (duhet 24) · alias: ${#KS_ALIAS} shenja"
            OUT="$(keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" 2>&1)" || {
              if printf '%s' "$OUT" | grep -qi 'password'; then echo "::error::ANDROID_KEYSTORE_PASSWORD është gabim (gjatësia ${#KS_PASS}, duhet 24 shenja)";
              else echo "::error::ANDROID_KEYSTORE_B64 është i paplotë ose i gabuar ($(stat -c %s "$RUNNER_TEMP/release.jks") bytes, duhet 4328)"; fi; exit 1; }
            printf '%s' "$OUT" | grep -qi "^$KS_ALIAS," || { echo "::error::ANDROID_KEY_ALIAS është gabim – duhet: nexora"; exit 1; }
            ./gradlew assembleRelease --no-daemon || { echo "::error::Gradle assembleRelease dështoi"; exit 1; }
            SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            [ -d "$SDK/build-tools" ] || { echo "::error::Android SDK build-tools nuk u gjetën ($SDK)"; exit 1; }
            BT="$SDK/build-tools/$(ls "$SDK/build-tools" | sort -V | tail -1)"
            UNSIGNED="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
            [ -n "$UNSIGNED" ] || { echo "::error::APK release nuk u gjet pas ndërtimit"; exit 1; }
            "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk" || { echo "::error::zipalign dështoi"; exit 1; }
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" --key-pass "pass:$KS_PASS" --out ../NEXORA-Player.apk "$RUNNER_TEMP/aligned.apk" \
              || { echo "::error::apksigner dështoi"; exit 1; }
            CERT="$("$BT/apksigner" verify --print-certs ../NEXORA-Player.apk | grep -m1 'SHA-256' || true)"
            echo "::notice::APK e nënshkruar – $CERT"
            rm -f "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::Mungojnë secrets ANDROID_KEYSTORE_* – po ndërtohet APK debug."
            ./gradlew assembleDebug --no-daemon
            mv app/build/outputs/apk/debug/app-debug.apk ../NEXORA-Player.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Player-Android
          path: NEXORA-Player.apk

  release:
    name: Publiko te GitHub Releases (latest)
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      # Emra fiks, që linku në nexoraweb.ch të mos ndryshojë kurrë:
      # .../releases/latest/download/NEXORA-Player-Setup.exe dhe NEXORA-Player.apk
      - name: Emrat fiks të skedarëve
        run: |
          mkdir -p release
          cp out/NEXORA-Player-Windows/*.exe release/NEXORA-Player-Setup.exe
          cp out/NEXORA-Player-Android/*.apk release/NEXORA-Player.apk
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('NEXORA {0}', github.ref_name) || format('NEXORA – build {0}', github.run_number) }}
          make_latest: true
          files: |
            release/NEXORA-Player-Setup.exe
            release/NEXORA-Player.apk
